<!DOCTYPE html>
<html>
<head>
    <title>Storage Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script src="extension-page-inject.js"></script>
    <script src="target-page-inject.js"></script>
    <script src="injectionUtils.js"></script>
    <script src="appContext.js"></script>
    <script src="delegateStorage.js"></script>
    <script src="storage.js"></script>
    <script src="fileService.js"></script>
    <script src="clipboard.js"></script>
    <script src="main.js"></script>
</head>
<body>

<div class="main">
    <div class="header">
        <ul id="tabs" class="nav nav-tabs">
            <!-- Tabs will be rendered here -->
        </ul>
    </div>

    <div id="list-panel" class="list">
        <div class="controls" style="margin-bottom: 10px;">
            <button id="add-btn" class="btn btn-primary btn-xs">Add Item</button>
            <button id="clear-btn" class="btn btn-danger btn-xs">Clear All</button>
            <button id="refresh-btn" class="btn btn-default btn-xs">Refresh</button>

            <span style="margin-left: 20px;">
                <button id="export-file-btn" class="btn btn-default btn-xs">Export File</button>
                <button id="export-clip-btn" class="btn btn-default btn-xs">Export Clip</button>
                <button id="import-file-btn" class="btn btn-default btn-xs">Import File</button>
                <button id="import-clip-btn" class="btn btn-default btn-xs">Import Clip</button>
            </span>
        </div>

        <div id="list-content">
            <!-- Storage results will be rendered here -->
        </div>
    </div>

    <div id="edit-panel" class="editPanel" style="display: none;">
        <input id="key-input" class="key form-control" type="text" placeholder="Name Of Key">

        <div class="text-info" style="margin-top: 5px;">Value in JSON format (unless string-only area)</div>
        <div id="validation-msg" class="text-warning"></div>

        <textarea id="value-input" class="value form-control" placeholder="Value" style="margin-top: 5px;"></textarea>

        <div class="controls">
            <button id="save-btn" class="btn btn-primary btn-xs">Save</button>
            <button id="cancel-btn" class="btn btn-danger btn-xs">Cancel</button>
        </div>
    </div>
</div>

</body>
</html>
